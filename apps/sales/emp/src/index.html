<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DealVoice – Employee Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DealVoice Employee Portal – View your assigned leads, analytics, and follow-ups.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
  <!-- PDF.js for seamless proposal preview -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    // Prevent mouse wheel from accidentally incrementing/decrementing number inputs
    document.addEventListener('wheel', function(e) {
      if (document.activeElement instanceof HTMLInputElement && document.activeElement.type === 'number') {
        document.activeElement.blur();
      }
    }, { passive: true });
  </script>
</body>
</html>
