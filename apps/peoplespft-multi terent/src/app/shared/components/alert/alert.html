<div *ngIf="alertService.state().visible" class="alert-overlay">
  <div class="alert-modal" 
       [ngClass]="{
         'alert-success': alertService.state().type === 'success',
         'alert-error': alertService.state().type === 'error',
         'alert-info': alertService.state().type === 'info',
         'alert-confirm': alertService.state().type === 'confirm'
       }">
    
    <div class="alert-header">
      <div class="alert-icon-wrapper">
        <!-- Success Icon -->
        <hugeicons-icon *ngIf="alertService.state().type === 'success'" [icon]="TaskDone01Icon" size="24" class="alert-icon" color="currentColor" [strokeWidth]="2.5"></hugeicons-icon>
        
        <!-- Error Icon -->
        <hugeicons-icon *ngIf="alertService.state().type === 'error'" [icon]="Alert01Icon" size="24" class="alert-icon" color="currentColor" [strokeWidth]="2.5"></hugeicons-icon>
        
        <!-- Info Icon -->
        <hugeicons-icon *ngIf="alertService.state().type === 'info'" [icon]="InformationCircleIcon" size="24" class="alert-icon" color="currentColor" [strokeWidth]="2.5"></hugeicons-icon>
        
        <!-- Confirm Icon -->
        <hugeicons-icon *ngIf="alertService.state().type === 'confirm'" [icon]="HelpCircleIcon" size="24" class="alert-icon" color="currentColor" [strokeWidth]="2.5"></hugeicons-icon>
      </div>
      
      <div class="alert-content">
        <h3 class="alert-title">
          {{ alertService.state().type === 'success' ? 'Success' : alertService.state().type === 'error' ? 'Error' : alertService.state().type === 'confirm' ? 'Confirm Action' : 'Notification' }}
        </h3>
        <p class="alert-message">{{ alertService.state().message }}</p>
      </div>
    </div>
    
    <div class="alert-actions">
      <ng-container *ngIf="alertService.state().type === 'confirm'">
        <button (click)="alertService.submitConfirm(false)" class="btn-cancel">Cancel</button>
        <button (click)="alertService.submitConfirm(true)" class="btn-ok">Confirm</button>
      </ng-container>

      <ng-container *ngIf="alertService.state().type !== 'confirm'">
        <button (click)="alertService.hide()" class="btn-ok">Got it</button>
      </ng-container>
    </div>
  </div>
</div>
