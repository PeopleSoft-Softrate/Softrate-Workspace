<div>
  <div class="company-full-card-head" style="margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center;">
    <h4>Overall History</h4>
    <div class="timeline-filters" style="display: flex; gap: 8px;">
      <button [class.active]="filterType === 'all'" (click)="setFilter('all')" class="filter-btn">All</button>
      <button [class.active]="filterType === 'activity'" (click)="setFilter('activity')" class="filter-btn">Activities</button>
      <button [class.active]="filterType === 'remark'" (click)="setFilter('remark')" class="filter-btn">Remarks</button>
      <button [class.active]="filterType === 'invoice'" (click)="setFilter('invoice')" class="filter-btn">Invoices</button>
      <button [class.active]="filterType === 'quotation'" (click)="setFilter('quotation')" class="filter-btn">Quotations</button>
    </div>
  </div>

  <div class="timeline-loading" *ngIf="loading">
    Loading history...
  </div>

  <div class="timeline-empty" *ngIf="!loading && filteredItems.length === 0">
    <svg viewBox="0 0 24 24" width="48" height="48" stroke="#94a3b8" stroke-width="1.5" fill="none">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>
    </svg>
    <p>No history available for the selected filter.</p>
  </div>

  <div class="timeline" *ngIf="!loading && filteredItems.length > 0">
    <div class="timeline-item" *ngFor="let item of filteredItems" [ngClass]="item.type">
      <div class="timeline-icon">
        <ng-container [ngSwitch]="item.type">
          <!-- Activity Icon (Calendar/Phone) -->
          <svg *ngSwitchCase="'activity'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          <!-- Remark Icon (Message) -->
          <svg *ngSwitchCase="'remark'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          <!-- Invoice Icon (File Text) -->
          <svg *ngSwitchCase="'invoice'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          <!-- Quotation Icon (Clipboard) -->
          <svg *ngSwitchCase="'quotation'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
        </ng-container>
      </div>
      <div class="timeline-content">
        <div class="timeline-time">{{ item.date | date:'medium' }}</div>
        <h4 class="timeline-title">{{ item.title }}</h4>
        <p class="timeline-desc">{{ item.description }}</p>
      </div>
    </div>
  </div>
</div>
